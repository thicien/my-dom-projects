<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Delete Row</title>
<style>
  table, td, th {
    border: 1px solid black;
    border-collapse: collapse;
    padding: 8px;
    text-align: center;
  }
</style>
</head>
<body>

<h2>Delete Row Example</h2>
<table id="deleteTable">
  <tr>
    <td>Row 1</td><td><button class="deleteBtn">Delete</button></td>
  </tr>
  <tr>
    <td>Row 2</td><td><button class="deleteBtn">Delete</button></td>
  </tr>
</table>

<script>
  const table = document.getElementById("deleteTable");

  table.addEventListener("click", function(e) {
    if (e.target.classList.contains("deleteBtn")) {
      const row = e.target.closest("tr");
      table.removeChild(row);
    }
  });
</script>

</body>
</html>
