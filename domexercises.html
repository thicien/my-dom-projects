
<!DOCTYPE html>
<html>
<head><title>Dynamic Table</title></head>
<body>
  <button id="makeTable">Create Table</button>
  <div id="container"></div>
  <button id="deleteRow">Delete Last Row</button>
  <script>
    document.getElementById("makeTable").addEventListener("click", () => {
      const table = document.createElement("table");
      table.border = "1";

      for (let i = 0; i < 3; i++) {
        const row = document.createElement("tr");
        for (let j = 0; j < 3; j++) {
          const cell = document.createElement("td");
          cell.textContent = `Row ${i+1}, Col ${j+1}`;
          row.appendChild(cell);
        }
        table.appendChild(row);
      }
      document.getElementById("container").innerHTML = "";
      document.getElementById("container").appendChild(table);
    });
    document.getElementById("deleteRow").addEventListener('click', () => {
        const table = document.getElementById("makeTable");
        if(table.row.length > 0) {
           table.deleteRow(-1);
        }
        
    })
  </script>
</body>
</html>
