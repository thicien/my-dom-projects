<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    :root { --row-height: 36px; }
    body { font-family: system-ui, Arial, sans-serif; margin: 0; padding: 16px; }
    h1 { margin: 0 0 12px; font-size: 20px; }
    .controls { margin-bottom: 10px; font-size: 14px; }

    .viewport {
      height: 60vh;             
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: auto;
      position: relative;
      background: #fff;
    }
    .spacer { height: 0; }

    .items {
      position: absolute;
      left: 0; right: 0;
      will-change: transform;   
    }

    .row {
      height: var(--row-height);
      line-height: var(--row-height);
      padding: 0 12px;
      border-bottom: 1px solid #f0f0f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row:nth-child(2n) { background: #fafafa; }
  </style>
</head>
<body>
  <h1>Virtualized List (20,000 items)</h1>
  <div class="controls">
    <button id="toTop">Scroll to Top</button>
    <button id="toMiddle">Scroll to Middle</button>
    <button id="toEnd">Scroll to End</button>
    <span id="rangeInfo" style="margin-left:8px; color:#555"></span>
  </div>

  <div id="viewport" class="viewport" aria-label="Virtualized list viewport">
    <div id="spacer" class="spacer" aria-hidden="true"></div>
    <div id="items" class="items" role="list"></div>
  </div>

  <script>
    
    const TOTAL_ITEMS = 20000;
    const ROW_HEIGHT = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--row-height')) || 36;
    const BUFFER = 6; 

    const data = Array.from({ length: TOTAL_ITEMS }, (_, i) => `Row #${i + 1} – This is a virtualized row with index ${i}`);

    
    const viewport = document.getElementById('viewport');
    const items = document.getElementById('items');
    const spacer = document.getElementById('spacer');
    const rangeInfo = document.getElementById('rangeInfo');

    
    let viewportHeight = viewport.clientHeight;
    let lastRecalcId = 0; // for rAF dedupe

    // Set spacer height = total virtual content height
    function updateSpacerHeight() {
      spacer.style.height = (TOTAL_ITEMS * ROW_HEIGHT) + 'px';
    }

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    function computeVisibleRange() {
      const scrollTop = viewport.scrollTop;
      const startIndex = clamp(Math.floor(scrollTop / ROW_HEIGHT) - BUFFER, 0, TOTAL_ITEMS);
      const visibleCount = Math.ceil(viewportHeight / ROW_HEIGHT) + BUFFER * 2;
      const endIndex = clamp(startIndex + visibleCount, 0, TOTAL_ITEMS);
      return { startIndex, endIndex, scrollTop };
    }

    function render() {
      const { startIndex, endIndex, scrollTop } = computeVisibleRange();

      // Position the items container to align with where the first row would be
      const translateY = startIndex * ROW_HEIGHT;
      items.style.transform = `translateY(${translateY}px)`;

      // Build the current slice of rows
      const frag = document.createDocumentFragment();
      items.innerHTML = '';
      for (let i = startIndex; i < endIndex; i++) {
        const div = document.createElement('div');
        div.className = 'row';
        div.setAttribute('role', 'listitem');
        div.textContent = data[i];
        frag.appendChild(div);
      }
      items.appendChild(frag);

      // Info label
      rangeInfo.textContent = `Showing ${startIndex + 1}–${endIndex} of ${TOTAL_ITEMS} (rows on DOM: ${endIndex - startIndex})`;
    }

    function scheduleRender() {
      const id = ++lastRecalcId;
      requestAnimationFrame(() => {
        if (id !== lastRecalcId) return; // drop stale frames
        viewportHeight = viewport.clientHeight;
        render();
      });
    }

    // Events
    viewport.addEventListener('scroll', scheduleRender, { passive: true });
    window.addEventListener('resize', scheduleRender);

    // Jump buttons (demo)
    document.getElementById('toTop').addEventListener('click', () => {
      viewport.scrollTop = 0; scheduleRender();
    });
    document.getElementById('toMiddle').addEventListener('click', () => {
      viewport.scrollTop = (TOTAL_ITEMS * ROW_HEIGHT) / 2; scheduleRender();
    });
    document.getElementById('toEnd').addEventListener('click', () => {
      viewport.scrollTop = TOTAL_ITEMS * ROW_HEIGHT; scheduleRender();
    });

    // Init
    updateSpacerHeight();
    scheduleRender();
  </script>
</body>
</html>
