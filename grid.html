<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
      body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.grid-container {
  display: grid;
  grid-template-columns: 1fr 1fr;  
  grid-template-rows: 1fr 1fr;     
  width: 500px;
  height: 500px;
  row-gap: 50px;
  column-gap: 50px;
  
}

.box {
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 18px;
  font-weight: bold;
  color: white;
}

.red { 
    background: red;
    margin-right: 20px;
    /* border-bottom-left-radius: 10px; */
    border-bottom-right-radius: 10px;
}
.green {
     background: green;
     margin-right: 20px;
     border-bottom-left-radius: 10px;
     /* border-bottom-left-radius: 10px; */
      
    }
.blue {
     background: blue;
     margin-right: 20px;
     /* border-top-left-radius: 10px; */
     border-top-right-radius: 10px; 
    }
.black {
     background: black;
     margin-right: 20px;
     border-top-left-radius: 10px;
     /* border-top-right-radius: 10px;  */
    }
  
    </style>
</head>
<body>
   <div class="grid-container">
    <div class="box red">Red</div>
    <div class="box green">Green</div>
    <div class="box blue">Blue</div>
    <div class="box black">Black</div>
   </div> 
</body>
</html>
